[project]
name = "skill-stocktake"
version = "0.1.0"
description = "Deterministic skill-usage aggregation for the stocktake audit (evidence mode, no verdict). Mechanical half of the code/LLM split; the Keep/Improve/Retire judgment stays with the fresh-context batch agents."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers"]
markers = [
  "unit: fast pure-python unit tests",
  "integration: CLI / end-to-end tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
