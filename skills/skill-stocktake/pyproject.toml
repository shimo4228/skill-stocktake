[project]
name = "skill-stocktake"
version = "0.1.0"
description = "Deterministic skill-usage aggregation for the stocktake audit (evidence mode, no verdict). Mechanical half of the code/LLM split; the Keep/Improve/Retire judgment stays with the fresh-context batch agents."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers"]
markers = [
  "unit: fast pure-python unit tests",
  "integration: CLI / end-to-end tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pin the same explicit select as the root ruff.toml. Without it, ruff's defaults (413 rules in 0.16)
# apply and the gate's verdict moves with upstream version bumps — the harness owns the check thresholds
# (rationale in the opening comment of the root ruff.toml; citation-sync introduced the same pin first, in 2026-08).
# The C901 threshold is 15, same as root. Budget is **pruned, never raised** (ADR-0056; source of truth is .claude/verify.md).
# The ANN rules enforce explicit types at boundaries (2026-08-31; rationale and design constraints in ~/.claude/.claude/verify.md).
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C901", "ANN001", "ANN002", "ANN003", "ANN201", "ANN401"]

[tool.ruff.lint.per-file-ignores]
# Test functions are not consumed boundaries. Type enforcement applies to production code only
"tests/**" = ["ANN"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
